
name: Public daily quotes

on:
  workflow_dispatch:
  schedule:
    - cron: '30 8 * * 1-5'

permissions:
  contents: read

jobs:
  quotes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate public quote parser (offline)
        run: python -m unittest discover -s tests -p 'test_public_quotes.py' -v
      - name: Fetch and validate public market quotes
        run: python fetch_quotes.py
      - run: |
          mkdir -p site
          cp index.html extra.js dashboard.js monitor.js intraday-v106.js notifier-v1061.js push-v1071.js intraday.json manifest.webmanifest sw.js icon-*.png sample.json quotes.json site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: quotes
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
