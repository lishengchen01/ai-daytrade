name: V1.08.2 safe shadow upgrade
on:
  pull_request:
    paths:
      - "upgrade-v1082-shadow.py"
      - "tests/test_shadow_upgrade_v1082.py"
      - ".github/workflows/v1082-updater-ci.yml"
  workflow_dispatch:
jobs:
  v1082-safe-upgrade:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile updater
        run: python -m py_compile upgrade-v1082-shadow.py tests/test_shadow_upgrade_v1082.py
      - name: Local-only upgrade safety regressions
        run: python -m unittest discover -s tests -p 'test_shadow_upgrade_v1082.py' -v
