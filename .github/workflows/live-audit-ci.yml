name: V1.07.4 Fugle private live audit safety
on:
  pull_request:
    paths:
      - "v1071/audit_live.py"
      - "v1071/test_audit_live.py"
      - "v1071/fugle.py"
      - ".github/workflows/live-audit-ci.yml"
  workflow_dispatch:
jobs:
  offline-audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal test dependencies
        run: python -m pip install -r v1071/requirements.txt
      - name: Syntax check
        run: python -m py_compile v1071/audit_live.py v1071/test_audit_live.py v1071/fugle.py
      - name: Offline safety tests (no keys, no network)
        run: python -m unittest v1071.test_audit_live -v
