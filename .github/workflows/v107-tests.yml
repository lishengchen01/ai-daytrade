name: V1.07 private strategy regression
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'v107/**'
      - '.github/workflows/v107-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression tests - no API credentials
        run: python -m unittest discover -s v107 -p 'test_*.py' -v
      - name: Verify no live provider secrets required
        run: |
          test -z "$FUGLE_API_KEY"
          echo "PASS: no market-data API credentials used in CI"
