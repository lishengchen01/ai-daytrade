name: V1.08.1 safe shadow Windows updater
on:
  pull_request:
    paths:
      - "upgrade-v1081-shadow.py"
      - "tests/test_shadow_upgrade.py"
      - ".github/workflows/v1081-updater-ci.yml"
  workflow_dispatch:
jobs:
  offline-updater-safety:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile pinned updater
        run: python -m py_compile upgrade-v1081-shadow.py tests/test_shadow_upgrade.py
      - name: Verify scope, rollback, and file validation (no network)
        run: python -m unittest discover -s tests -p 'test_shadow_upgrade.py' -v
