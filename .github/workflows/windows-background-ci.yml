name: V1.07.2 Windows private background push
on:
  pull_request:
    paths:
      - "v1071/push_background.py"
      - "v1071/test_push_background.py"
      - "v1071/requirements.txt"
      - "INSTALL-PRIVATE-PUSH-BACKGROUND.ps1"
      - "INSTALL-PRIVATE-PUSH-BACKGROUND.cmd"
      - ".github/workflows/windows-background-ci.yml"
  workflow_dispatch:
jobs:
  windows-offline-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal background server dependency
        run: python -m pip install cryptography
      - name: Test safe background server
        run: python -m unittest v1071.test_push_background -v
      - name: Check Python syntax
        run: python -m py_compile v1071/push_background.py v1071/test_push_background.py
